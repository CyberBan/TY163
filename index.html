<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Обычная иконка сайта -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Иконка для iPhone -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Название при добавлении на экран iPhone -->
    <meta name="apple-mobile-web-app-title" content="Расписание" />
    <meta name="application-name" content="Расписание" />

    <!-- Открывать как приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="theme-color" content="#0f0f0f" />

    <title>Расписание</title>

    <meta property="og:title" content="Расписание" />
    <meta property="og:image" content="/apple-touch-icon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Расписание" />
    <meta name="twitter:image" content="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
